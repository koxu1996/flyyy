[package]
name = "flyyy-init"
version = "0.1.0"
edition = "2021"

[dependencies]

# The launch config (config.json) written by the machine agent.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

# fork/execve, setgroups/setgid/setuid, signal masks, waitpid, the interface ioctls and listen(2) with a
# backlog over SOMAXCONN: PID 1 needs the raw calls.
libc = { version = "0.2.191", default-features = false, features = [] }

# The mounts, the root switch (chroot), the hostname, and the vsock listeners' sockets.
nix = { version = "0.31.3", default-features = false, features = ["mount", "fs", "hostname", "socket"] }

# vsock streams for the port relays (the listeners are made with nix, for their backlog).
vsock = { version = "0.5.4", default-features = false, features = [] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
